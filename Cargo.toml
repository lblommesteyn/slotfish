[package]
name = "slotfish"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Deterministic event-replay research engine for Solana pump.fun microstructure"

[dependencies]
anyhow = "1"
arrow = { version = "55", default-features = false, features = ["prettyprint"] }
parquet = { version = "55", default-features = false, features = ["arrow", "snap", "zstd"] }
bs58 = "0.5"
clap = { version = "4", features = ["derive"] }
flate2 = "1"
memory-stats = "1"
rayon = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "gzip", "native-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.8"

[dev-dependencies]

[profile.release]
debug = 0
lto = "thin"
codegen-units = 1

[[bin]]
name = "slotfish"
path = "src/main.rs"
